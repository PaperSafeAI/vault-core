name: Release

# Publishes @papersafeailabs/vault-core when a `v*` tag is pushed (made by
# scripts/release.mjs): checks the tag against package.json, runs every check,
# scans the whole history for secrets, then publishes to npm with provenance,
# which links the package to this repository and this workflow run.
#
# Needs the repository secret NPM_TOKEN: an npm automation token for the
# @papersafeailabs org. npm provenance needs this repository to be public.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"; exit 1; }

      - name: Checks
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run vectors:check
          npm run types:check

      - uses: ./.github/actions/setup-gitleaks
      - name: Secret scan and suppression regression checks
        run: npm run security:scan

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
